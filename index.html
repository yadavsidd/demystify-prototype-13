    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-color: #000000;
        --text-color: #E5E7EB; /* Gray 200 */
        --grid-color: rgba(255, 255, 255, 0.1);
        --accent-color: #ffffff; /* White */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      /* Autofill override */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px #111 inset !important;
          -webkit-text-fill-color: white !important;
          transition: background-color 5000s ease-in-out 0s;
      }

      .font-heading {
        font-family: 'Chakra Petch', sans-serif;
      }
      
      .fade-in-up {
        opacity: 0;
        transform: translateY(20px);
        animation: slide-and-fade-in 0.6s ease-out forwards;
      }
      
      @keyframes pulse-mic {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      .animate-pulse-mic {
        animation: pulse-mic 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes slide-and-fade-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .highlight {
        background-color: rgba(255, 255, 255, 0.25);
        border-radius: 3px;
        padding: 1px 3px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      @keyframes dynamic-text-anim {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        20% {
          opacity: 1;
          transform: translateY(0);
        }
        80% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-20px);
        }
      }
      .animate-dynamic-text {
        animation: dynamic-text-anim 3s ease-out forwards;
      }

      /* Gradient Button Styles */
      .gradient-button {
        background: var(--accent-color);
        color: black;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }
      
      .gradient-button:hover {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        transform: translateY(-1px);
      }
      
      .gradient-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s;
        z-index: -1;
      }
      
      .gradient-button:hover::before {
        transform: translateX(100%);
      }

      .gradient-button-variant {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }
      
      .gradient-button-variant:hover {
        border-color: var(--accent-color);
        background: rgba(255, 255, 255, 0.1);
        color: var(--accent-color);
      }
    </style>
